<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>משחק הלבשה</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4f0;font-family:Arial,sans-serif;color:#23232a}header{padding:18px 26px;background:white;border-bottom:1px solid #ddd}h1{margin:0;font-size:25px}main{display:grid;grid-template-columns:minmax(280px,1fr) minmax(240px,440px);gap:20px;max-width:1200px;margin:20px auto;padding:0 15px}.panel{background:white;border-radius:20px;padding:18px;box-shadow:0 3px 16px #0001}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tabs button,.actions button{padding:10px 16px;border:1px solid #ddd;border-radius:12px;background:white;cursor:pointer}.tabs button.active{background:#1c62c7;color:white}.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:12px}.item{border:1px solid #ddd;border-radius:15px;padding:14px;background:#fafafa;cursor:grab;text-align:center;touch-action:none;user-select:none}.item:active{cursor:grabbing}.swatch{display:block;width:64px;height:60px;margin:0 auto 10px;clip-path:polygon(15% 0,85% 0,100% 30%,80% 43%,80% 100%,20% 100%,20% 43%,0 30%)}.model{position:relative;max-width:360px;margin:auto;aspect-ratio:630/2000}.model img,.model svg{width:100%;height:100%;position:absolute;inset:0}.model svg{pointer-events:none}.stage{min-height:65vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(#fff,#edf2f8)}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}.hint{color:#666;font-size:14px}.ghost{position:fixed;z-index:1000;pointer-events:none;background:#1c62c7;color:white;border-radius:10px;padding:10px;transform:translate(-50%,-50%)}@media(max-width:740px){main{display:flex;flex-direction:column}.stage{min-height:65vh}.model{width:240px}} </style></head><body><header><h1>משחק ההלבשה שלנו</h1><div class="hint">בחרי פריט בלחיצה או גררי אותו לדמות</div></header><main><section class="panel"><h2>ארון הבגדים</h2><div class="tabs" id="tabs"></div><div class="items" id="items"></div><p class="hint">זוהי גרסת בדיקה פונקציונלית עם פריטים גרפיים. בהמשך נחליף אותם בשכבות צילום ריאליסטיות.</p></section><section class="panel"><div class="stage" id="stage"><div class="model" id="model"><img src="body.png" alt="הדמות המקורית"><svg viewBox="690 0 630 2000" preserveAspectRatio="none" id="layers"></svg></div></div><div class="actions"><button id="clear">התחלה מחדש</button><button id="remove">הסרת פריט אחרון</button></div></section></main><script>
const catalog={"חולצות":[['טי שירט שחורה','#242424','shirt'],['חולצה מכופתרת תכלת','#8bbce5','shirt'],['חולצת ברצלונה','#9a173b','barca'],['חולצה ירוקה','#55755d','shirt']],"מכנסיים":[['מכנסי חליפה','#20232c','pants'],['ג׳ינס כחול','#486d9e','pants'],['מכנסי דגמ״ח','#77735c','pants']],"זקנים":[['ללא זקן','none','beard'],['זיפים','#46372e','stubble'],['זקן ארוך','#33291f','beard']],"כובעים":[['ללא כובע','none','hat'],['כיפה שחורה','#181818','kippa'],['שטריימל','#4c3426','shtreimel']],"נעליים":[['נעליים שחורות','#202020','shoes'],['סניקרס לבנות','#ededed','shoes']]};
let active='חולצות',worn={},history=[];const tabs=document.getElementById('tabs'),items=document.getElementById('items'),layers=document.getElementById('layers');
function group(t){return t==='barca'?'shirt':t==='stubble'?'beard':t==='kippa'||t==='shtreimel'?'hat':t}
function shape(type,color){if(color==='none')return '';const a=(s)=>`<path d="${s}" fill="${color}" stroke="#242424" stroke-width="3" stroke-linejoin="round"/>`;
if(type==='shirt'||type==='barca')return a('M 816 309 Q 850 300 885 277 L 945 316 Q 999 340 1057 316 L 1115 278 Q 1150 294 1193 315 L 1291 558 L 1194 585 L 1145 464 L 1144 1026 L 815 1026 L 815 464 L 761 582 L 704 559 Z')+(type==='barca'?'<path d="M900 316 V1020 M1000 335 V1020 M1090 315 V1020" stroke="#133e89" stroke-width="35" opacity=".85"/>':'');
if(type==='pants')return a('M 815 1020 L 1144 1020 L 1161 1290 L 1006 1290 L 983 1145 L 960 1290 L 799 1290 Z');
if(type==='beard')return a('M 917 226 Q 983 290 1046 226 Q 1045 328 983 348 Q 920 326 917 226 Z');
if(type==='stubble')return '<path d="M917 228 Q980 285 1046 228 Q1042 295 981 307 Q920 291 917 228Z" fill="#46372e" opacity=".38"/>';
if(type==='hat')return a('M 873 63 Q 981 -10 1090 63 L 1090 109 L 873 109 Z')+a('M 844 106 Q 979 127 1120 106 L 1124 130 Q 980 156 840 130Z');
if(type==='kippa')return a('M 912 38 Q 985 -1 1050 40 Q 979 25 912 50Z');
if(type==='shtreimel')return a('M 864 12 Q 980 -35 1105 12 L 1110 128 Q 979 156 857 128 Z');
if(type==='shoes')return a('M 808 1860 L 851 1860 Q 860 1920 900 1948 Q 925 1985 850 1990 L 750 1989 Q 747 1960 790 1933 Z')+a('M 1084 1860 L 1125 1860 Q 1140 1920 1191 1948 Q 1220 1986 1144 1990 L 1040 1989 Q 1030 1960 1070 1933Z');return ''}
function draw(){layers.innerHTML=Object.values(worn).map(x=>shape(x[2],x[1])).join('')}
function equip(x){const k=group(x[2]);history.push({...worn});if(x[1]==='none')delete worn[k];else worn[k]=x;draw()}
function render(){tabs.innerHTML='';items.innerHTML='';Object.keys(catalog).forEach(c=>{const b=document.createElement('button');b.textContent=c;b.className=c===active?'active':'';b.onclick=()=>{active=c;render()};tabs.appendChild(b)});catalog[active].forEach(x=>{const b=document.createElement('button');b.className='item';b.innerHTML=`<span class="swatch" style="background:${x[1]==='none'?'#ddd':x[1]}"></span>${x[0]}`;b.onclick=()=>equip(x);b.addEventListener('pointerdown',e=>startDrag(e,x,b));items.appendChild(b)})}
let drag=null;function startDrag(e,x,el){if(e.button!==0)return;const startX=e.clientX,startY=e.clientY;drag={x,startX,startY,el,moved:false,ghost:null};el.setPointerCapture(e.pointerId)}
document.addEventListener('pointermove',e=>{if(!drag)return;if(!drag.moved&&Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>8){drag.moved=true;drag.ghost=document.createElement('div');drag.ghost.className='ghost';drag.ghost.textContent=drag.x[0];document.body.appendChild(drag.ghost)}if(drag.ghost){drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px'}});
document.addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;if(d.ghost)d.ghost.remove();if(d.moved){const r=document.getElementById('stage').getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)equip(d.x)}});
document.getElementById('clear').onclick=()=>{history.push({...worn});worn={};draw()};document.getElementById('remove').onclick=()=>{worn=history.pop()||{};draw()};render();
</script></body></html>
