function thumb(x){let type=x[2],k=keyOf(type);const vb= k==='shirt'||k==='coat'?'660 250 650 950':k==='pants'?'760 990 450 950':k==='shoes'?'740 1830 490 170':k==='hat'?'820 -35 360 220':k==='beard'||k==='peyot'?'860 120 250 360':k==='neck'||k==='chain'?'890 300 200 530':k==='glasses'?'870 120 230 120':k==='armband'?'1170 400 125 110':'780 980 400 300';return `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">${defs()}${renderShape(x)}</svg>`}
function render(){tabs.innerHTML='';C.forEach(([c,emoji])=>{const b=document.createElement('button');b.className='tab'+(cat===c?' active':'');b.textContent=emoji+' '+c;b.onclick=()=>{cat=c;render()};tabs.appendChild(b)});const q=document.querySelector('#search').value.trim();items.innerHTML='';DATA.filter(x=>x[0]===cat&&x[1].includes(q)).forEach(x=>{const b=document.createElement('button');b.className='item';b.dataset.name=x[1];b.innerHTML=`<div class="art">${thumb(x)}</div><span>${x[1]}</span><small>לחצי או גררי</small>`;b.onclick=()=>{if(!b.dataset.wasDragged)equip(x);b.dataset.wasDragged=''};b.draggable=true;b.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',JSON.stringify(x));e.dataTransfer.effectAllowed='copy'});let start=null,ghost=null,moved=false;b.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;start={x:e.clientX,y:e.clientY};moved=false});b.addEventListener('pointermove',e=>{if(!start)return;if(!moved&&Math.hypot(e.clientX-start.x,e.clientY-start.y)>12){moved=true;b.dataset.wasDragged='1';ghost=document.createElement('div');ghost.className='dragGhost';ghost.textContent=x[1];document.body.appendChild(ghost)}if(ghost){ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px'}});b.addEventListener('pointerup',e=>{if(start&&moved){const r=stage.getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)equip(x);if(ghost)ghost.remove();ghost=null}start=null});items.appendChild(b)});draw()}
stage.addEventListener('dragover',e=>{e.preventDefault();stage.classList.add('drop')});stage.addEventListener('dragleave',()=>stage.classList.remove('drop'));stage.addEventListener('drop',e=>{e.preventDefault();stage.classList.remove('drop');try{equip(JSON.parse(e.dataTransfer.getData('text/plain')))}catch(err){toast('לא ניתן להוסיף את הפריט')}});document.querySelector('#search').addEventListener('input',render);document.querySelector('#reset').onclick=()=>{history.push({...wear});wear={};draw()};document.querySelector('#undo').onclick=()=>{if(history.length){wear=history.pop();draw()}else toast('אין פעולה לביטול')};document.querySelector('#save').onclick=async()=>{try{const img=document.querySelector('#body');await img.decode();const canvas=document.createElement('canvas');canvas.width=630;canvas.height=2000;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,630,2000);const svgText=new XMLSerializer().serializeToString(outfit);const blob=new Blob([svgText],{type:'image/svg+xml'});const url=URL.createObjectURL(blob);const overlay=new Image();overlay.onload=()=>{ctx.drawImage(overlay,0,0,630,2000);URL.revokeObjectURL(url);const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='החתן-שלי.png';a.click()};overlay.onerror=()=>toast('לא ניתן לשמור כרגע');overlay.src=url}catch(err){toast('שמירת התמונה נכשלה')}};document.querySelector('#body').onerror=()=>toast('קובץ body.png חסר — העלי אותו לצד index.html');render();
</script></body></html>
